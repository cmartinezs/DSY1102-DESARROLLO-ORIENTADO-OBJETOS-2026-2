<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Veterinaria · Herencia y Polimorfismo · DSY1102</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033;display:grid;place-items:center;min-height:100vh}
.box{max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0f172a12}
.spin{width:34px;height:34px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:r 1s linear infinite;margin-bottom:16px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><h1>Cargando Lab Veterinaria…</h1><p>Preparando la experiencia guiada.</p><p id="msg"></p></div>
<script>
const BASE_URL='https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/e4afb4a1d3f7fcba182bbe6243a921034c1cc8eb/page/lab-veterinaria-herencia-polimorfismo.html';
const ENH_URL='https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/master/page/lab-veterinaria-enhancements.js';
Promise.all([
  fetch(BASE_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Base HTTP '+r.status);return r.text()}),
  fetch(ENH_URL+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Enh HTTP '+r.status);return r.text()})
]).then(([html,enh])=>{
  document.open();document.write(html);document.close();
  const enhancement=document.createElement('script');enhancement.textContent=enh;document.body.appendChild(enhancement);
  const ui=document.createElement('script');
  ui.textContent=`(()=>{
    const STORE='dsy1102-vet-lab-v1';
    let reviewStage=null;
    let lastStage=null;
    const css=document.createElement('style');
    css.textContent='.step-card .actions .btn-primary{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}.step-card .actions .btn-primary:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(67,56,202,.25)}.step-card .actions .btn-primary:active{transform:translateY(1px) scale(.985);box-shadow:none}.step-card .actions .btn-primary.is-saving{opacity:.78;cursor:wait}.step-card .actions .btn-primary.is-saved{background:#166534!important;color:#fff!important}.checkpoint-focus-hidden{display:none!important}.review-mode-note{background:#eff6ff;border:1px solid #93c5fd;border-radius:.8rem;padding:.8rem 1rem;margin:.8rem 0;color:#1e3a8a}';
    document.head.appendChild(css);

    function read(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(_){return null}}
    function write(s){localStorage.setItem(STORE,JSON.stringify(s))}
    function validRepo(v){return /^https:\\/\\/github\\.com\\/[^/]+\\/[^/]+\\/?$/i.test(String(v||'').trim())}
    function validPath(v){const x=String(v||'').trim();return !!x&&!/^https?:\\/\\//i.test(x)&&(/^[A-Za-z]:\\\\/.test(x)||x.startsWith('/')||x.startsWith('\\\\\\\\'))}
    function currentValues(){return {
      name:document.getElementById('studentName')?.value.trim()||'',
      section:document.getElementById('studentSection')?.value.trim()||'',
      repoUrl:document.getElementById('repoUrl')?.value.trim()||'',
      repoPath:document.getElementById('repoPath')?.value.trim()||'',
      deviceAlias:document.getElementById('deviceAlias')?.value.trim()||''
    }}
    function matchesSaved(){
      const s=read();if(!s?.student)return false;
      const v=currentValues();
      if(!validRepo(v.repoUrl)||!validPath(v.repoPath)||!v.name||!v.section||!v.deviceAlias)return false;
      return ['name','section','repoUrl','repoPath','deviceAlias'].every(k=>String(s.student[k]||'').trim()===v[k]);
    }
    function normalizeRepoNotice(){
      document.getElementById('repoStandardPersistent')?.remove();
      const s=read();
      const notices=[...document.querySelectorAll('.repo-standard-notice')];
      if(Number(s?.currentStage)!==0){notices.forEach(n=>n.remove());return;}
      notices.slice(1).forEach(n=>n.remove());
    }
    function ensureReviewControls(){
      const app=document.getElementById('app');
      const s=read();
      if(!app||!s)return;
      const current=Number(s.currentStage)||0;
      if(lastStage!==current){reviewStage=null;lastStage=current;}
      const quiz=app.querySelector('.quiz');
      if(!quiz)return;
      const passed=!!quiz.querySelector('.notice-ok');
      let btn=quiz.querySelector('.review-stage-btn');
      let note=app.querySelector('.review-mode-note');
      if(!passed){if(btn)btn.remove();if(note)note.remove();return;}
      if(!btn){
        btn=document.createElement('button');
        btn.type='button';
        btn.className='btn btn-secondary review-stage-btn';
        btn.style.marginLeft='.5rem';
        const primary=quiz.querySelector('button');
        if(primary)primary.insertAdjacentElement('afterend',btn);else quiz.appendChild(btn);
      }
      const reviewing=reviewStage===current;
      btn.textContent=reviewing?'✕ Cerrar repaso':'↩ Repasar esta etapa';
      if(reviewing){
        if(!note){
          note=document.createElement('div');
          note.className='review-mode-note';
          note.innerHTML='<strong>Modo repaso.</strong> Estás revisando una etapa ya superada. Tu progreso, XP y checkpoint no se modificarán.';
          const firstCard=app.querySelector('.step-card');
          if(firstCard)firstCard.insertAdjacentElement('beforebegin',note);
        }
      }else if(note)note.remove();
    }
    function focusCheckpoint(){
      const app=document.getElementById('app');
      const s=read();
      if(!app||!s)return;
      const current=Number(s.currentStage)||0;
      if(lastStage!==current){reviewStage=null;lastStage=current;}
      const quiz=app.querySelector('.quiz');
      const hasQuestions=!!quiz?.querySelector('.q');
      const passed=!!quiz?.querySelector('.notice-ok');
      const reviewing=passed&&reviewStage===current;
      const shouldHide=hasQuestions||(passed&&!reviewing);
      app.querySelectorAll('.step-card').forEach(card=>card.classList.toggle('checkpoint-focus-hidden',shouldHide));
      ensureReviewControls();
    }
    function releaseSessionGuard(){
      document.querySelectorAll('.step-card .switch input[type=checkbox]').forEach(sw=>{
        sw.disabled=false;
        const slider=sw.nextElementSibling;
        if(slider){slider.style.opacity='1';slider.style.cursor='pointer'}
        sw.closest('.switchline')?.querySelector('.action-required-note')?.remove();
      });
    }
    function sync(){
      normalizeRepoNotice();
      focusCheckpoint();
      const s=read();if(!s)return;
      if(Number(s.currentStage)!==0){releaseSessionGuard();return;}
      if(!s.actionRequirements)s.actionRequirements={};
      const ok=matchesSaved();
      if(s.actionRequirements.s0p1!==ok){s.actionRequirements.s0p1=ok;write(s)}
      const card=document.querySelector('.step-card');
      const sw=card?.querySelector('.switch input[type=checkbox]');
      if(sw){sw.disabled=!ok;if(!ok)sw.checked=false;const slider=sw.nextElementSibling;if(slider){slider.style.opacity=ok?'1':'.45';slider.style.cursor=ok?'pointer':'not-allowed'}const line=sw.closest('.switchline');const note=line?.querySelector('.action-required-note');if(ok&&note)note.remove()}
      const b=card?.querySelector('.actions .btn-primary');
      if(b&&!b.classList.contains('is-saving')){b.classList.toggle('is-saved',ok);b.textContent=ok?'✓ Datos de sesión guardados':'Guardar datos de sesión'}
    }

    document.addEventListener('input',e=>{if(['studentName','studentSection','repoUrl','repoPath','deviceAlias'].includes(e.target?.id))setTimeout(sync,0)},true);
    document.addEventListener('click',e=>{
      const s=read();
      const reviewBtn=e.target&&e.target.closest?e.target.closest('.review-stage-btn'):null;
      if(reviewBtn){
        const current=Number(s?.currentStage)||0;
        reviewStage=reviewStage===current?null:current;
        focusCheckpoint();
        if(reviewStage===current){setTimeout(()=>document.querySelector('.review-mode-note')?.scrollIntoView({behavior:'smooth',block:'start'}),0)}
        return;
      }
      const b=e.target&&e.target.closest?e.target.closest('.step-card .actions .btn-primary'):null;
      if(Number(s?.currentStage)===0&&b&&b.textContent.includes('Guardar')){b.classList.remove('is-saved');b.classList.add('is-saving');b.textContent='Guardando…';setTimeout(()=>{b.classList.remove('is-saving');sync()},250)}
      const wrap=e.target&&e.target.closest?e.target.closest('.switch'):null;
      if(Number(s?.currentStage)===0&&wrap){sync();const sw=wrap.querySelector('input[type=checkbox]');if(sw?.disabled){e.preventDefault();e.stopImmediatePropagation();sw.checked=false}}
      setTimeout(focusCheckpoint,0);
    },true);
    setTimeout(sync,50);setTimeout(sync,300);setInterval(sync,500);
  })();`;
  document.body.appendChild(ui);
}).catch(e=>{const msg=document.getElementById('msg');if(msg)msg.textContent='No se pudo cargar el laboratorio. Recarga la página. Si el problema continúa, informa al docente.';console.error(e)});
</script>
</body>
</html>
