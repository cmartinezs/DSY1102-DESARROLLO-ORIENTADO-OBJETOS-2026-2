<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Veterinaria · Herencia y Polimorfismo · DSY1102</title>
<style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033;display:grid;place-items:center;min-height:100vh}.box{max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0f172a12}.spin{width:34px;height:34px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:r 1s linear infinite;margin-bottom:16px}@keyframes r{to{transform:rotate(360deg)}}code{background:#eef2ff;padding:.15rem .35rem;border-radius:.35rem}</style>
</head>
<body>
<div class="box"><div class="spin"></div><h1>Cargando Lab Veterinaria…</h1><p>Preparando la experiencia guiada y validando las acciones obligatorias.</p><p id="msg"></p></div>
<script>
const BASE='https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/e4afb4a1d3f7fcba182bbe6243a921034c1cc8eb/page/lab-veterinaria-herencia-polimorfismo.html';
const PATCH=`<script>
(function(){
  const STORE='dsy1102-vet-lab-v1';
  const REQUIRED_FIELDS=['name','section','repoPath','deviceAlias'];
  const IDENTITY_INPUTS=new Set(['studentName','studentSection','repoUrl','repoPath','deviceAlias']);

  function readState(){
    try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}
  }
  function writeState(s){localStorage.setItem(STORE,JSON.stringify(s))}
  function ensureActions(s){
    if(!s.actionRequirements)s.actionRequirements={};
    return s.actionRequirements;
  }
  function hasSavedSession(s){
    if(!s||!s.student)return false;
    const fieldsOk=REQUIRED_FIELDS.every(k=>String(s.student[k]||'').trim());
    const eventOk=Array.isArray(s.events)&&s.events.some(e=>e&&e.type==='session_configured');
    return fieldsOk&&eventOk;
  }
  function requirementMet(stepId){
    const s=readState();
    if(!s)return false;
    if(stepId==='s0p1'){
      const actions=ensureActions(s);
      if(actions.s0p1===true)return true;
      if(hasSavedSession(s)){
        actions.s0p1=true;
        writeState(s);
        return true;
      }
      return false;
    }
    return true;
  }
  function setRequirement(stepId,value){
    const s=readState(); if(!s)return;
    const actions=ensureActions(s); actions[stepId]=!!value;
    writeState(s);
  }
  function invalidateIdentityProgress(reason){
    const s=readState(); if(!s)return false;
    const actions=ensureActions(s); actions.s0p1=false;
    if(s.steps&&s.steps.s0p1){
      s.steps.s0p1=false;
      s.xp=Math.max(0,(Number(s.xp)||0)-20);
      s.events=s.events||[];
      s.events.push({at:new Date().toISOString(),type:'step_invalidated',detail:{step:'s0p1',reason},deviceAlias:s.student?.deviceAlias||''});
      if(Number(s.currentStage)>0)s.currentStage=0;
    }
    writeState(s);
    return true;
  }
  function guardSwitch(input,allowed){
    if(!input)return;
    input.disabled=!allowed;
    const slider=input.nextElementSibling;
    if(slider){slider.style.cursor=allowed?'pointer':'not-allowed';slider.style.opacity=allowed?'1':'.45'}
    const line=input.closest('.switchline');
    if(line){
      let note=line.querySelector('.action-required-note');
      if(!allowed){
        if(!note){
          note=document.createElement('span');note.className='action-required-note';note.style.cssText='display:block;margin-left:.5rem;color:#b45309;font-size:.82rem;font-weight:700';
          line.appendChild(note);
        }
        note.textContent='🔒 Primero completa y guarda la acción obligatoria de este paso.';
      }else if(note)note.remove();
    }
  }
  function applyGuards(){
    const s=readState(); if(!s)return;
    const cards=[...document.querySelectorAll('.step-card')];
    if(Number(s.currentStage)===0&&cards[0]){
      const sw=cards[0].querySelector('.switch input[type=checkbox]');
      guardSwitch(sw,requirementMet('s0p1'));
      const btn=cards[0].querySelector('.actions .btn-primary');
      if(btn){
        const met=requirementMet('s0p1');
        btn.textContent=met?'✓ Datos de sesión guardados':'Guardar datos de sesión';
      }
    }
  }

  // Migración: corrige avances creados por el bug anterior.
  const initial=readState();
  if(initial){
    const actions=ensureActions(initial);
    if(hasSavedSession(initial))actions.s0p1=true;
    else if(initial.steps&&initial.steps.s0p1){
      initial.steps.s0p1=false;
      initial.xp=Math.max(0,(Number(initial.xp)||0)-20);
      if(Number(initial.currentStage)>0)initial.currentStage=0;
      initial.events=initial.events||[];
      initial.events.push({at:new Date().toISOString(),type:'step_invalidated',detail:{step:'s0p1',reason:'missing_required_action'},deviceAlias:initial.student?.deviceAlias||''});
    }
    writeState(initial);
  }

  // Defensa doble: aunque alguien intente disparar el cambio manualmente,
  // toggleStep no permite completar un paso con requisito pendiente.
  const originalToggle=window.toggleStep;
  if(typeof originalToggle==='function'){
    window.toggleStep=function(id,on,xp){
      if(on&&!requirementMet(id)){
        alert('Antes de marcar este paso como realizado debes completar y guardar la acción obligatoria.');
        applyGuards();
        return;
      }
      return originalToggle.apply(this,arguments);
    };
  }

  // Guardar sesión habilita el switch sólo si la acción terminó correctamente.
  const originalSaveIdentity=window.saveIdentity;
  if(typeof originalSaveIdentity==='function'){
    window.saveIdentity=function(){
      originalSaveIdentity.apply(this,arguments);
      setTimeout(()=>{
        const s=readState();
        if(hasSavedSession(s))setRequirement('s0p1',true);
        applyGuards();
      },0);
    };
  }

  // Si modifica un dato después de guardarlo, vuelve a quedar pendiente hasta guardar de nuevo.
  document.addEventListener('input',e=>{
    if(!IDENTITY_INPUTS.has(e.target?.id))return;
    invalidateIdentityProgress('identity_changed_after_save');
    applyGuards();
  },true);

  // Hook reutilizable para cualquier futura acción obligatoria dentro de un paso.
  window.completeRequiredStepAction=function(stepId,detail){
    const s=readState(); if(!s)return;
    const actions=ensureActions(s); actions[stepId]=true;
    s.events=s.events||[];
    s.events.push({at:new Date().toISOString(),type:'required_action_completed',detail:{step:stepId,...(detail||{})},deviceAlias:s.student?.deviceAlias||''});
    writeState(s); applyGuards();
  };
  window.invalidateRequiredStepAction=function(stepId){setRequirement(stepId,false);applyGuards()};

  const originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(){const r=originalRender.apply(this,arguments);setTimeout(applyGuards,0);return r};
  }
  new MutationObserver(()=>applyGuards()).observe(document.body,{childList:true,subtree:true});
  if(typeof window.render==='function')window.render(); else applyGuards();
})();
<\/script>`;
fetch(BASE,{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
  .then(html=>{
    const patched=html.replace('</body>',PATCH+'\n</body>');
    document.open();document.write(patched);document.close();
  })
  .catch(e=>{document.getElementById('msg').innerHTML='No se pudo cargar el laboratorio. Recarga la página. Si el problema continúa, informa al docente.';console.error(e)});
</script>
</body>
</html>
