<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Veterinaria · Herencia y Polimorfismo · DSY1102</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033;display:grid;place-items:center;min-height:100vh}
.box{max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0f172a12}
.spin{width:34px;height:34px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:r 1s linear infinite;margin-bottom:16px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Cargando Lab Veterinaria…</h1>
  <p>Preparando la experiencia guiada.</p>
  <p id="msg"></p>
</div>
<script>
const BASE_URL='https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/e4afb4a1d3f7fcba182bbe6243a921034c1cc8eb/page/lab-veterinaria-herencia-polimorfismo.html';
const ENH_URL='https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/master/page/lab-veterinaria-enhancements.js';

Promise.all([
  fetch(BASE_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Base HTTP '+r.status);return r.text()}),
  fetch(ENH_URL+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Enh HTTP '+r.status);return r.text()})
]).then(([html,enh])=>{
  document.open();
  document.write(html);
  document.close();

  const enhancement=document.createElement('script');
  enhancement.textContent=enh;
  document.body.appendChild(enhancement);

  const ui=document.createElement('script');
  ui.textContent=`(()=>{
    const css=document.createElement('style');
    css.textContent='.step-card .actions .btn-primary{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}.step-card .actions .btn-primary:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(67,56,202,.25)}.step-card .actions .btn-primary:active{transform:translateY(1px) scale(.985);box-shadow:none}.step-card .actions .btn-primary.is-saving{opacity:.78;cursor:wait}.step-card .actions .btn-primary.is-saved{background:#166534!important;color:#fff!important}';
    document.head.appendChild(css);
    document.addEventListener('click',e=>{
      const b=e.target&&e.target.closest?e.target.closest('.step-card .actions .btn-primary'):null;
      if(!b||!b.textContent.includes('Guardar'))return;
      b.classList.remove('is-saved');b.classList.add('is-saving');b.textContent='Guardando…';
      setTimeout(()=>{
        const current=document.querySelector('.step-card .actions .btn-primary');
        if(!current)return;
        let s=null;try{s=JSON.parse(localStorage.getItem('dsy1102-vet-lab-v1')||'null')}catch(_){ }
        const ok=!!(s&&s.actionRequirements&&s.actionRequirements.s0p1===true);
        current.classList.remove('is-saving');
        if(ok){current.classList.add('is-saved');current.textContent='✓ Datos de sesión guardados'}
        else{current.textContent='Guardar datos de sesión'}
      },180);
    },true);
  })();`;
  document.body.appendChild(ui);
}).catch(e=>{
  const msg=document.getElementById('msg');
  if(msg)msg.textContent='No se pudo cargar el laboratorio. Recarga la página. Si el problema continúa, informa al docente.';
  console.error(e);
});
</script>
</body>
</html>
