  function readState(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
  function writeState(s){localStorage.setItem(STORE,JSON.stringify(s))}
  function ensureActions(s){if(!s.actionRequirements)s.actionRequirements={};return s.actionRequirements}
  function hasSavedSession(s){if(!s||!s.student)return false;const fieldsOk=REQUIRED_FIELDS.every(k=>String(s.student[k]||'').trim());const eventOk=Array.isArray(s.events)&&s.events.some(e=>e&&e.type==='session_configured');return fieldsOk&&eventOk}
  function requirementMet(stepId){const s=readState();if(!s)return false;if(stepId==='s0p1'){const actions=ensureActions(s);if(actions.s0p1===true)return true;if(hasSavedSession(s)){actions.s0p1=true;writeState(s);return true}return false}return true}
  function setRequirement(stepId,value){const s=readState();if(!s)return;ensureActions(s)[stepId]=!!value;writeState(s)}
  function invalidateIdentityProgress(reason){const s=readState();if(!s)return false;ensureActions(s).s0p1=false;if(s.steps&&s.steps.s0p1){s.steps.s0p1=false;s.xp=Math.max(0,(Number(s.xp)||0)-20);s.events=s.events||[];s.events.push({at:new Date().toISOString(),type:'step_invalidated',detail:{step:'s0p1',reason},deviceAlias:s.student?.deviceAlias||''});if(Number(s.currentStage)>0)s.currentStage=0}writeState(s);return true}
  function guardSwitch(input,allowed){if(!input)return;input.disabled=!allowed;const slider=input.nextElementSibling;if(slider){slider.style.cursor=allowed?'pointer':'not-allowed';slider.style.opacity=allowed?'1':'.45'}const line=input.closest('.switchline');if(line){let note=line.querySelector('.action-required-note');if(!allowed){if(!note){note=document.createElement('span');note.className='action-required-note';note.style.cssText='display:block;margin-left:.5rem;color:#b45309;font-size:.82rem;font-weight:700';line.appendChild(note)}note.textContent='🔒 Primero completa y guarda la acción obligatoria de este paso.'}else if(note)note.remove()}}
  function currentStepIds(){const s=readState();const ids=[['s0p1','s0p2'],['s1p1','s1p2'],['s2p1','s2p2'],['s3p1','s3p2'],['s4p1','s4p2'],['s5p1','s5p2'],['s6p1','s6p2'],['s7p1','s7p2']];return ids[Number(s?.currentStage)||0]||[]}
  function injectGuidance(){const ids=currentStepIds();document.querySelectorAll('.step-card').forEach((card,i)=>{const id=ids[i],g=GUIDES[id];if(!g||card.querySelector('.guided-now'))return;const mission=card.querySelector('.mission');if(!mission)return;const box=document.createElement('div');box.className='guided-now';box.style.cssText='background:#eff6ff;border:1px solid #93c5fd;border-radius:.8rem;padding:1rem;margin:.9rem 0';box.innerHTML='<strong style="font-size:1.05rem">🧭 Haz esto ahora</strong><ol style="padding-left:1.35rem;line-height:1.55">'+g.steps.map(x=>'<li style="margin:.45rem 0">'+x+'</li>').join('')+'</ol><div style="background:#fff;border:1px solid #bfdbfe;border-radius:.65rem;padding:.75rem"><strong>✅ Comprueba antes de continuar</strong><ul style="padding-left:1.25rem;margin-bottom:0">'+g.check.map(x=>'<li style="margin:.3rem 0">'+x+'</li>').join('')+'</ul></div>';mission.insertAdjacentElement('afterend',box)})}
  function applyGuards(){const s=readState();if(!s)return;const cards=[...document.querySelectorAll('.step-card')];if(Number(s.currentStage)===0&&cards[0]){const sw=cards[0].querySelector('.switch input[type=checkbox]');guardSwitch(sw,requirementMet('s0p1'));const btn=cards[0].querySelector('.actions .btn-primary');if(btn){const met=requirementMet('s0p1');btn.textContent=met?'✓ Datos de sesión guardados':'Guardar datos de sesión'}}injectGuidance()}

  const initial=readState();if(initial){const actions=ensureActions(initial);if(hasSavedSession(initial))actions.s0p1=true;else if(initial.steps&&initial.steps.s0p1){initial.steps.s0p1=false;initial.xp=Math.max(0,(Number(initial.xp)||0)-20);if(Number(initial.currentStage)>0)initial.currentStage=0;initial.events=initial.events||[];initial.events.push({at:new Date().toISOString(),type:'step_invalidated',detail:{step:'s0p1',reason:'missing_required_action'},deviceAlias:initial.student?.deviceAlias||''})}writeState(initial)}

  const originalToggle=window.toggleStep;if(typeof originalToggle==='function'){window.toggleStep=function(id,on,xp){if(on&&!requirementMet(id)){alert('Antes de marcar este paso como realizado debes completar y guardar la acción obligatoria.');applyGuards();return}return originalToggle.apply(this,arguments)}}
  const originalSaveIdentity=window.saveIdentity;if(typeof originalSaveIdentity==='function'){window.saveIdentity=function(){originalSaveIdentity.apply(this,arguments);setTimeout(()=>{const s=readState();if(hasSavedSession(s))setRequirement('s0p1',true);applyGuards()},0)}}
  document.addEventListener('input',e=>{if(!IDENTITY_INPUTS.has(e.target?.id))return;invalidateIdentityProgress('identity_changed_after_save');applyGuards()},true)
  window.completeRequiredStepAction=function(stepId,detail){const s=readState();if(!s)return;ensureActions(s)[stepId]=true;s.events=s.events||[];s.events.push({at:new Date().toISOString(),type:'required_action_completed',detail:{step:stepId,...(detail||{})},deviceAlias:s.student?.deviceAlias||''});writeState(s);applyGuards()};window.invalidateRequiredStepAction=function(stepId){setRequirement(stepId,false);applyGuards()}
  const originalRender=window.render;if(typeof originalRender==='function'){window.render=function(){const r=originalRender.apply(this,arguments);setTimeout(applyGuards,0);return r}}
  new MutationObserver(()=>applyGuards()).observe(document.body,{childList:true,subtree:true});if(typeof window.render==='function')window.render();else applyGuards()
})();
