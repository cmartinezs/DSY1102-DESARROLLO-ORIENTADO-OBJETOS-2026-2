<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Veterinaria · Herencia y Polimorfismo · DSY1102</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033;display:grid;place-items:center;min-height:100vh}
.box{max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0f172a12}
.spin{width:34px;height:34px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:r 1s linear infinite;margin-bottom:16px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Cargando Lab Veterinaria…</h1>
  <p>Preparando la experiencia guiada.</p>
  <p id="msg"></p>
</div>
<script>
const BASE_URL = 'https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/e4afb4a1d3f7fcba182bbe6243a921034c1cc8eb/page/lab-veterinaria-herencia-polimorfismo.html';
const ENHANCEMENT_URL = 'https://raw.githubusercontent.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2/master/page/lab-veterinaria-enhancements.js';

fetch(BASE_URL, {cache:'no-store'})
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(html => {
    const scriptTag = '<scr' + 'ipt src="' + ENHANCEMENT_URL + '?v=' + Date.now() + '"></scr' + 'ipt>';
    const finalHtml = html.replace('</body>', scriptTag + '\n</body>');
    document.open();
    document.write(finalHtml);
    document.close();
  })
  .catch(e => {
    document.getElementById('msg').textContent = 'No se pudo cargar el laboratorio. Recarga la página. Si el problema continúa, informa al docente.';
    console.error(e);
  });
</script>
</body>
</html>
