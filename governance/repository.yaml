  owner: cmartinezs
  canonical_url: https://github.com/cmartinezs/DSY1102-DESARROLLO-ORIENTADO-OBJETOS-2026-2
  type: EDUCATIONAL
  secondary_types: []
  facets:
    - COURSE_REPOSITORY
    - LEARNER_FIRST
  purpose: >-
    Provide a learner-first, reproducible support repository for DSY1102 Desarrollo Orientado a
    Objetos 2026-2, organizing weekly learning progression, concepts, examples, exercises,
    challenges, guided laboratories, the incremental PetCare project and course-operation guidance
    while preserving AVA and institutional sources as the authorities for official communications,
    evaluations and resources that belong there.
  status:
    lifecycle: ACTIVE
  canonical_branch: master

